<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    {# 支持移动端 #}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% block meta %}
    <!-- 默认的 meta 标签 -->
    <meta property="og:title" content="凡学子的博客">
    <meta property="og:description" content="凡学子的博客">
    <meta property="og:image" content="https://linxz.online/icons8-pen-32.png">
    <meta property="og:url" content="https://linxz.online">
    {% endblock meta %}

    <!-- 百度站点验证 -->
    <meta name="baidu-site-verification" content="codeva-0MxZ0uNvvd" />
    <title>凡学子的博客</title>
    {# 引入favicon #}
    <link type="image/png" sizes="16x16" rel="icon" href="/icons8-pen-16.png">
    <link type="image/png" sizes="32x32" rel="icon" href="/icons8-pen-32.png">
    <!-- 引入通用的CSS文件 -->
    <link rel="stylesheet" href="/css/tailwind-like.css?v=202501091022">
    <!-- 引入新的 section-styles.css 文件 -->
    <link rel="stylesheet" href="/css/section-styles.css">
    {# 引入markdown-table样式 #}
    <link rel="stylesheet" href="/css/markdown-table.css">
    {# 引入代码块pre美化的css文件 #}
    <link rel="stylesheet" href="/css/pre.css">
    {# 引入home里面的超链接美化css #}
    <link rel="stylesheet" href="/css/home-post.css">
    {# 引入双击图片放大的css #}
    <link rel="stylesheet" href="/css/img-zoom.css">
    <!-- 引入page-beauty的css文件 -->
    <link rel="stylesheet" href="/css/page-beauty.css">
    {# 站内搜索样式 #}
    <link rel="stylesheet" href="/css/search-bar.css?v=20261030">

    <!--引入数学公式 -->
    <!-- 添加 KaTeX CSS -->
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"> -->
    <!-- 添加 KaTeX JS -->
    <!-- <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script> -->
    <!-- 添加 auto-render 扩展，用于自动渲染页面中的数学公式 -->
    <!-- <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script> -->

    <!-- KaTeX 资源 -->
    <link rel="stylesheet" href="/lib/katex/katex.min.css">
    <script defer src="/lib/katex/katex.min.js"></script>
    <script defer src="/lib/katex/auto-render.min.js"></script>

    <script type="module" src="/search.js?v=20261030"></script>

</head>

<body>
    <nav>
        <div class="container">
            <a href="/">题匾</a>
            <a href="/shorts/">片念</a>
            <a href="/blog/">修斋</a>
            <a href="/books/">书卷</a>
            <a href="/about/">无我</a>
            <a href="/social/">江湖</a>
            <a href="/family-letters/">林氏家书</a>
            <a href="/starry-night/">星辰</a>
        </div>
    </nav>
  
    <div class="container">
        <div class="header-content">
            <!-- 搜索框 -->
            <div class="site-search" role="search" aria-label="站内搜索">
                <input type="search" id="search-bar-input" placeholder="寻寻觅觅..."
                    aria-label="搜索文章" aria-controls="site-search-panel" aria-expanded="false"
                    autocomplete="off" enterkeyhint="search" maxlength="160" />
                <div id="site-search-panel" class="site-search-panel" hidden>
                    <p id="site-search-status" role="status" aria-live="polite">输入关键词，查找文章</p>
                    <ul id="site-search-results" aria-label="搜索结果"></ul>
                    <button id="site-search-retry" type="button" hidden>重新加载</button>
                </div>
            </div>

            <!-- 小鸡图片 -->
            <img id="chicken-img" src="https://linxz.online/chicken.gif" style="display: none;" alt="Chicken">
        </div>

        <br>
        <section class="section">
            {% block content %} {% endblock %}
        </section>
    </div>

  {# 小鸡图标 #}
  <script>
    const searchInput = document.getElementById('search-bar-input');
    const chickenImg = document.getElementById('chicken-img');

    // 鼠标移入显示图片
    searchInput.addEventListener('focus', () => {
        chickenImg.style.display = 'block';
    });

    // 鼠标移出隐藏图片
    searchInput.addEventListener('blur', () => {
        chickenImg.style.display = 'none';
    });
  </script>


      <!-- 配置 KaTeX 自动渲染 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\[", right: "\\]", display: true},
                    {left: "\\(", right: "\\)", display: false}
                ],
                throwOnError: false
            });
        });
    </script>

</body>

</html>
